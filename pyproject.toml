[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''/(\n    \.git\n  | \.venv\n  | build\n  | dist\n  | data_cache\n  | docs\n)/'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
select = ["E", "W", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实网络的数据源集成测试",
]
